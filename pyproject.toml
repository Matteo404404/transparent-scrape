[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transparent-scrape"
version = "0.1.0"
description = "Modular fetch-and-parse toolkit for public transparency data (EU institutions, extensible core)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matteo" }]
keywords = [
    "transparency",
    "lobbying",
    "european-parliament",
    "open-data",
    "scraping",
    "eu",
    "public-data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "httpx>=0.27",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Matteo404404/transparent-scrape"
Documentation = "https://github.com/Matteo404404/transparent-scrape/tree/main/docs"
Repository = "https://github.com/Matteo404404/transparent-scrape"
Issues = "https://github.com/Matteo404404/transparent-scrape/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
tscrape = "transparent_scrape.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: network integration tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
